name: Build debug APK

# Framework v7.0 Section 72: this sandbox has no Android SDK and no network
# path to Google's Maven repo or the Android SDK/Gradle distribution servers
# (verified directly, not assumed - see the project README). GitHub's own
# runners have neither restriction, so this workflow is what actually turns
# the project into an installed app. No gradle-wrapper.jar is committed to
# this repo (one could not be produced correctly without a working Gradle
# install), so the "Provision Gradle" step below generates a real one fresh,
# on this runner, before anything else runs.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Provision Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 9.6

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: smartsilent-scheduler-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
